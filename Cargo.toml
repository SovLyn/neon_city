[package]
name = "neon_city"
version = "0.1.0"
edition = "2024"
autobins = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "=1.23.2", features = ["derive"] }
glam = "=0.30.5"
wgpu = { version = "=24.0.5", features = ["webgpu", "wgsl"] }

[dev-dependencies]
naga = { version = "=24.0.0", features = ["wgsl-in"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "=0.1.7"
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "=0.4.50"
js-sys = "=0.3.77"
serde_json = "=1.0.140"
image = { version = "=0.25.6", default-features = false, features = ["png"] }
web-sys = { version = "=0.3.77", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "Node", "Event", "EventTarget", "KeyboardEvent", "MouseEvent", "VisibilityState", "Performance", "Location", "Url", "UrlSearchParams", "Response", "console"] }
